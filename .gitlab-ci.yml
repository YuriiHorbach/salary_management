image: ruby:3.3.3-slim

cache:
  paths:
    - apt-cache/
    - vendor/bundle

before_script:
  - export APT_CACHE_DIR=`pwd`/apt-cache && mkdir -pv $APT_CACHE_DIR
  - apt update -qq && apt -o dir::cache::archives="$APT_CACHE_DIR" install -yqq build-essential libpq-dev git curl
  - gem install bundler --no-document -v 2.4.1
  - apt-get install npm -y
  - npm install yarn -g
  - apt-get install -y nodejs
  - bundle install --path /cache

stages:
  - test

rspec:
  stage: test
  tags:
    - macos
  variables:
    RAILS_ENV: test
    POSTGRES_HOST_AUTH_METHOD: trust
  services:
    - postgres:14.6-alpine
  script:
    # install nodejs
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_$NODE_MAJOR.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
    - apt-get install -y --no-install-recommends nodejs

    # Ensure bundler is installed and run bundle install
    - gem install bundler --no-document -v 2.4.1
    - bundle check --path vendor/bundle || bundle install --path vendor/bundle --jobs $(nproc)

    # Copy database configuration and run database tasks
    - cp config/database-gitlab.yml config/database.yml
    - bundle exec rails db:create db:schema:load --trace

    # Precompile assets and run RSpec tests
    - bundle exec rails assets:precompile --trace
    - bundle exec rspec

lint:
  stage: test
  tags:
    - macos
  variables:
    RAILS_ENV: test
  script:
    - git fetch origin main:main
    - bundle config set --local with 'development'
    - bundle check --path vendor/bundle || bundle install --path vendor/bundle --jobs $(nproc)
    - bundle exec rubocop-changes -b main $CI_MERGE_REQUEST_CHANGED_FILES#$CI_DEFAULT_BRANCH $CI_MERGE_REQUEST_CHANGED_FILES
  allow_failure: true
