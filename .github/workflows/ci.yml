name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: RSpec
    # ubuntu-latest is fine now: the project runs the latest 3.4.x patch, and
    # ruby/setup-ruby always publishes builds for the newest patch of a series
    # on current runner images.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salary_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salary_management_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler-cache: true

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: Make Chrome available to Capybara
        run: echo "CHROME_BIN=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      # Do not use db:prepare here: on a fresh database it also runs db:seed,
      # and this project's seeds wipe data and create 50 fake employees, which
      # breaks the test suite. Load only the schema instead.
      - name: Prepare database
        run: bin/rails db:create db:schema:load

      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Run RSpec
        run: bundle exec rspec

      # The project currently has 19 pre-existing RuboCop offenses. Keep the
      # check visible in CI, but do not fail the build until they are fixed.
      - name: Run RuboCop (non-blocking)
        run: bundle exec rubocop --parallel
        continue-on-error: true
