services:
  db:
    image: postgres:16-alpine
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: salary_management_development
    ports:
      - "127.0.0.1:5433:5432"

  web:
    build: .
    command: ./bin/rails server -b 0.0.0.0
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - RAILS_MAX_THREADS=5
    depends_on:
      - db

  # База з ФЕЙКОВИМИ даними для AI-агентів. Стартує лише з --profile agent.
  agent_db:
    image: postgres:16-alpine
    profiles: ["agent"]
    volumes:
      - agent_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sm_agent
      POSTGRES_PASSWORD: agent_password
      POSTGRES_DB: salary_management_agent
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm_agent -d salary_management_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
    name: salary_management_db_data
  agent_db_data:
    name: salary_management_agent_db_data
