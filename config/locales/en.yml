        passport number) or by <code>identifier</code> (book code).
      columns:
        column: Column
        meaning: Meaning
        when: When to fill
        type:
          meaning_html: 'Record type: <code>salary</code> (salary), <code>sick_day</code>
            (sick days) or <code>vacation</code> (vacation pay).'
          when_html: When the file mixes types. If the column is absent, the type
            comes from the “Data type” field in the form.
        id_code:
          meaning: Employee tax ID / RNOKPP or passport number.
          when_html: 'One of two columns for finding the employee: <code>id_code</code>
            or <code>identifier</code>.'
        identifier:
          meaning: Employee book code.
          when_html: Alternative to <code>id_code</code> when the file has no tax
            ID/passport.
        period:
          meaning_html: Accrual month in <code>YYYY-MM</code> format (for example,
            <code>2020-03</code>).
          when: Always.
        amount:
          meaning: Salary amount in UAH.
          when_html: Only for <code>salary</code>.
        pfu_amount:
          meaning: Sick leave paid by PFU / social fund, UAH.
          when_html: Only for <code>sick_day</code>.
        enterprise_amount:
          meaning: Sick leave paid by the enterprise, UAH.
          when_html: Only for <code>sick_day</code>.
        vacation_amount:
          meaning: Vacation pay, UAH.
          when_html: Only for <code>vacation</code>.
        income_tax:
          meaning: Withheld income tax, UAH.
          when_html: Optional; if empty, treated as <code>0</code>.
        military_tax:
          meaning: Withheld military levy, UAH.
          when_html: Optional; if empty, treated as <code>0</code>.
        net_amount:
          meaning: Amount to be paid (“net”), UAH.
          when_html: Optional; if empty, the amount minus taxes.
        department:
          meaning: 'Department: name (case-insensitive) or numeric id.'
          when: Optional. Used to distinguish salaries by department in the same month.
        paid_on:
          meaning_html: Salary for in <code>YYYY-MM-DD</code> format.
          when_html: Optional (only <code>salary</code>); defaults to the first day
            of <code>period</code>.
      sample_hint: The sample contains headers only — add data rows to it.
      taxes_html: Taxes from each row are stored as-is without recalculation. After
        import, monthly totals are recalculated by the tax calculator for each employee,
        month and income type, so imported data appears in reports immediately. If
        <code>net_amount</code> is omitted, it is calculated as the amount minus taxes.
      update_hint: A salary row updates an existing record with the same employee,
        month and department; salaries for the same month in different departments
        are stored separately.
