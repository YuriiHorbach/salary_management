# Desktop (Electron) overrides.
#
# The base compose file starts services as soon as containers are created. The
# desktop shell uses `docker compose up --wait`, so both PostgreSQL and Rails
# need healthchecks that describe real readiness. Keeping these overrides in a
# separate file means the regular `docker compose up` development workflow is
# unchanged.
services:
  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salary_management_development"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    # Keep the container PID file out of the bind-mounted project directory.
    # A host `tmp/pids/server.pid` (from `bin/dev` or a manual `rails server`)
    # must never make the containerized Puma think a server is already running.
    environment:
      - PIDFILE=/tmp/puma-server.pid
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 60s
