        Passnummer) oder über <code>identifier</code> (Buchcode) gefunden.
      columns:
        column: Spalte
        meaning: Bedeutung
        when: Wann ausfüllen
        type:
          meaning_html: 'Datensatztyp: <code>salary</code> (Gehalt), <code>sick_day</code>
            (Krankheitstage) oder <code>vacation</code> (Urlaubsgeld).'
          when_html: Wenn die Datei verschiedene Typen enthält. Fehlt die Spalte,
            wird der Typ aus dem Feld „Datentyp“ im Formular übernommen.
        id_code:
          meaning: Steuer-ID / RNOKPP oder Passnummer des Mitarbeiters.
          when_html: 'Eine von zwei Spalten zum Finden des Mitarbeiters: <code>id_code</code>
            oder <code>identifier</code>.'
        identifier:
          meaning: Buchcode des Mitarbeiters.
          when_html: Alternative zu <code>id_code</code>, wenn die Datei keine Steuer-ID/Passnummer
            enthält.
        period:
          meaning_html: Abrechnungsmonat im Format <code>YYYY-MM</code> (zum Beispiel
            <code>2020-03</code>).
          when: Immer.
        amount:
          meaning: Gehaltsbetrag in UAH.
          when_html: Nur für <code>salary</code>.
        pfu_amount:
          meaning: Krankengeld der PFU / des Sozialfonds, UAH.
          when_html: Nur für <code>sick_day</code>.
        enterprise_amount:
          meaning: Krankengeld des Unternehmens, UAH.
          when_html: Nur für <code>sick_day</code>.
        vacation_amount:
          meaning: Urlaubsgeld, UAH.
          when_html: Nur für <code>vacation</code>.
        income_tax:
          meaning: Einbehaltene Einkommensteuer, UAH.
          when_html: Optional; wenn leer, wird <code>0</code> angenommen.
        military_tax:
          meaning: Einbehaltene Militärabgabe, UAH.
          when_html: Optional; wenn leer, wird <code>0</code> angenommen.
        net_amount:
          meaning: Auszahlungsbetrag („netto“), UAH.
          when_html: Optional; wenn leer, der Betrag abzüglich Steuern.
        department:
          meaning: 'Abteilung: Name (Groß-/Kleinschreibung wird ignoriert) oder numerische
            ID.'
          when: Optional. Wird verwendet, um Gehälter nach Abteilung im selben Monat
            zu unterscheiden.
        paid_on:
          meaning_html: Auszahlungsdatum im Format <code>YYYY-MM-DD</code>.
          when_html: Optional (nur <code>salary</code>); standardmäßig der erste Tag
            von <code>period</code>.
      sample_hint: Das Beispiel enthält nur Kopfzeilen — fügen Sie Datenzeilen hinzu.
      taxes_html: Steuern jeder Zeile werden unverändert gespeichert. Nach dem Import
        werden die Monatssummen für jeden Mitarbeiter, Monat und Einkommenstyp neu
        berechnet, sodass importierte Daten sofort in Berichten erscheinen. Fehlt
        <code>net_amount</code>, wird es als Betrag abzüglich Steuern berechnet.
